<section studioSection icon="bookmark" heading="Presets">
  <div class="grid grid-cols-2 gap-1.5">
    @for (preset of presets; track preset.id) {
      <button
        type="button"
        class="group flex items-center gap-2.5 rounded-lg border border-white/[0.06] p-2 text-left transition-colors hover:border-white/15 hover:bg-white/[0.03]"
        (click)="apply(preset)"
      >
        <span
          class="size-8 shrink-0 rounded-md"
          [style.background]="
            'radial-gradient(circle at 30% 30%, ' +
            preset.settings.appearance.accent +
            ', #111 75%)'
          "
        ></span>
        <span class="min-w-0">
          <span class="block text-[12.5px] font-semibold text-white/90">{{ preset.name }}</span>
          <span class="block truncate text-[10.5px] text-white/40">{{
            effects[preset.settings.transition.effect].name
          }}</span>
        </span>
      </button>
    }
  </div>
  @if (custom().length) {
    <ul class="space-y-1">
      @for (preset of custom(); track preset.id) {
        <li class="flex items-center gap-2 rounded-lg bg-white/[0.03] py-1 pr-1 pl-3">
          <button
            type="button"
            class="flex-1 truncate text-left text-[12.5px] text-white/85 hover:text-white"
            (click)="apply(preset)"
          >
            {{ preset.name }}
          </button>
          <button
            studioIconButton
            icon="trash"
            label="Delete preset"
            (click)="remove(preset.id)"
          ></button>
        </li>
      }
    </ul>
  }
  <form class="flex gap-2" (submit)="save($event)">
    <input
      #presetName
      [value]="name()"
      (input)="name.set(presetName.value)"
      placeholder="Preset name"
      class="field flex-1"
    />
    <button studioButton [type]="'submit'" icon="plus">Save</button>
  </form>
</section>
