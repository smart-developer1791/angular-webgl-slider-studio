<div
  class="flex h-dvh w-full overflow-hidden bg-[#08080a] font-sans text-white"
  [style.--ui-accent]="accent()"
  [style.--ui-on-accent]="accentText()"
>
  <main #main class="relative h-full min-w-0 flex-1 bg-[#08080a]">
    <div studioSlider></div>
    <div class="absolute top-5 right-5 z-20 flex gap-2">
      <button
        type="button"
        [attr.aria-label]="fullscreen() ? 'Exit fullscreen' : 'Fullscreen'"
        [title]="fullscreen() ? 'Exit fullscreen (F)' : 'Fullscreen (F)'"
        class="grid size-10 place-items-center rounded-full border border-white/15 bg-black/30 text-white backdrop-blur-xl transition hover:bg-black/50"
        (click)="toggleFullscreen()"
      >
        <svg [lucideIcon]="fullscreen() ? 'minimize-2' : 'maximize-2'" class="size-4"></svg>
      </button>
      @if (!panelOpen() && !fullscreen()) {
        <button
          type="button"
          class="inline-flex h-10 items-center gap-2 rounded-full border border-white/15 bg-black/30 pr-4 pl-3.5 text-[13px] font-medium text-white backdrop-blur-xl transition hover:bg-black/50"
          (click)="panelOpen.set(true)"
        >
          <svg lucideIcon="sliders-horizontal" class="size-4"></svg>
          Settings
          <kbd
            class="ml-1 hidden rounded border border-white/20 px-1 font-mono text-[10px] text-white/60 md:inline"
            >H</kbd
          >
        </button>
      }
    </div>
  </main>
  <aside studioSettings [open]="panelOpen()" (close)="panelOpen.set(false)"></aside>
</div>
@for (toast of toasts(); track toast.key) {
  <div
    role="status"
    class="toast fixed bottom-5 left-5 z-50 flex max-w-sm items-center gap-2.5 rounded-xl border border-white/10 bg-[#141417]/95 px-4 py-3 text-[13px] text-white shadow-2xl backdrop-blur-xl"
  >
    @if (toast.kind === 'error') {
      <svg lucideIcon="circle-alert" class="size-4 shrink-0 text-[#ff6b6b]"></svg>
    } @else {
      <svg lucideIcon="circle-check" class="size-4 shrink-0" style="color: var(--ui-accent)"></svg>
    }
    {{ toast.message }}
  </div>
}
